name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      # The audit must stay reproducible from the archived v1 data: it is the
      # evidence base for every removal this rebuild made.
      - name: Regenerate the baseline audit profile
        run: make audit

      - name: Rebuild canonical tables
        run: make build-metrics

      - name: Rebuild release
        run: make build-release

      # Compares the committed artifacts against a fresh rebuild, ignoring
      # build-time stamps. `git status --porcelain` cannot be used here:
      # code_commit records HEAD, and committing the manifest moves HEAD, so
      # that check would fail on every commit regardless of staleness.
      - name: Fail on stale generated artifacts
        run: make check-stale

      - name: Validate release
        run: make validate-release

      - name: Determinism
        run: make determinism

      - name: Tests
        run: make test
